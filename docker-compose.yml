# ─────────────────────────────────────────────────────────────────────────────
# Coastal Climate Risk Intelligence Dashboard — Docker Compose (Development)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and update values.
#   2. docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: coastal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coastal_user
      POSTGRES_PASSWORD: coastal_pass
      POSTGRES_DB: coastal_climate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastal_user -d coastal_climate_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coastal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coastal_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DB/Redis URLs to use container service names
      DATABASE_URL: postgresql+asyncpg://coastal_user:coastal_pass@postgres:5432/coastal_climate_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React / Vite Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coastal_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Prevent host node_modules from overriding container's
      - /app/node_modules

volumes:
  postgres_data:
    name: coastal_postgres_data
